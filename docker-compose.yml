services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: conduit-api:local
    environment:
      DATABASE_URL: postgresql://conduit:conduit_pass@postgres:5432/conduit?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret}
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://mimir:9009/otlp/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_SERVICE_NAME: conduit-api
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_pass
      POSTGRES_DB: conduit
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conduit -d conduit']
      interval: 3s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.1.2
    command: ['-config.file=/etc/loki/loki-config.yaml']
    ports:
      - '3101:3100'
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.4.1
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - '3200:3200'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo

  mimir:
    image: grafana/mimir:2.12.0
    command: ['-config.file=/etc/mimir/mimir.yaml']
    ports:
      - '9009:9009'
    volumes:
      - ./ops/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/tmp/mimir

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '3001:3000'
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
