services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: conduit_test
      POSTGRES_PASSWORD: conduit_test_pass
      POSTGRES_DB: conduit_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit_test -d conduit_test"]
      interval: 3s
      timeout: 5s
      retries: 15
